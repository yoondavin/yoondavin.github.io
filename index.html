        if (!t) return;
        var a = t.getAttribute('data-m');
        if (a === 'close') close();
        else if (a === 'prev') go(-1);
        else if (a === 'next') go(1);
        else if (a === 'edit') { close(); if (opts.onEditPost) opts.onEditPost(id); }
        else if (a === 'del') { if (opts.onDeletePost && opts.onDeletePost(id)) close(); }
      });
      m.addEventListener('error', function (e) {
        if (e.target && e.target.tagName === 'IMG' && e.target.parentNode.classList.contains('igb-mav')) e.target.parentNode.innerHTML = ICON.avatar;
      }, true);
    }

    function openStory(id) {
      var d = st.data || {}, p = d.profile || {};
      var list = sorted(d.posts).filter(function (q) { return q.type === 'story'; });
      var si = 0, fi = 0, timer = null;
      list.forEach(function (q, i) { if (q.id === id) si = i; });
      var m = document.createElement('div');
      m.className = 'igb igb-modal igb-story';
      m.innerHTML = '<div class="igb-sframe" role="dialog" aria-modal="true"><div class="igb-sbars"></div>' +
        '<div class="igb-shead"><span class="igb-mav">' + avatar(p.avatar) + '</span><span class="igb-suser">' + esc(p.username || '') + '</span>' +
        '<span class="igb-sdate"></span><span class="igb-sp"></span>' +
        (ed ? '<button type="button" class="igb-mbtn" data-s="edit">수정</button><button type="button" class="igb-mbtn igb-red" data-s="del">삭제</button>' : '') +
        '<button type="button" class="igb-sx" data-s="close" aria-label="닫기">' + ICON.closeW + '</button></div>' +
        '<div class="igb-smedia"></div>' +
        '<button type="button" class="igb-sz igb-szl" data-s="prev" aria-label="이전"></button>' +
        '<button type="button" class="igb-sz igb-szr" data-s="next" aria-label="다음"></button></div>';
      document.body.appendChild(m);
      var prevOverflow = document.body.style.overflow;
      document.body.style.overflow = 'hidden';
      var frame = m.querySelector('.igb-sframe'), bars = m.querySelector('.igb-sbars'), media = m.querySelector('.igb-smedia');
      function frames(q) { return ((q && q.images) || []).map(safe).filter(Boolean); }
      function show() {
        clearTimeout(timer);
        var q = list[si], fr = frames(q), u = fr[fi] || '', v = ytId(u);
        bars.innerHTML = fr.map(function (_, k) { return '<i><b' + (k < fi ? ' style="width:100%"' : '') + '></b></i>'; }).join('');
        m.querySelector('.igb-sdate').textContent = longDate(q.date);
        frame.classList.toggle('igb-svid', !!v);
        var bar = bars.children[fi] && bars.children[fi].firstChild;
        if (v) {
          media.innerHTML = '<div class="igb-vslide igb-sv" data-vid="' + v + '"><img src="' + esc(ytThumb(v)) + '" alt=""><span class="igb-play">' + ICON.play + '</span></div>';
          if (bar) bar.style.width = '100%';
        } else {
          media.innerHTML = u ? '<img src="' + esc(u) + '" alt="">' : '';
          if (bar) { void bar.offsetWidth; bar.style.transition = 'width 5s linear'; bar.style.width = '100%'; }
          timer = setTimeout(function () { go(1); }, 5000);
        }
      }
      function go(dir) {
        fi += dir;
        if (fi >= frames(list[si]).length) {
          if (si + 1 < list.length) { si++; fi = 0; } else { close(); return; }
        } else if (fi < 0) {
          if (si > 0) { si--; fi = Math.max(0, frames(list[si]).length - 1); } else fi = 0;
        }
        show();
      }
      function close() {
        clearTimeout(timer);
        m.remove();
        document.body.style.overflow = prevOverflow;
        document.removeEventListener('keydown', onKey);
      }
      function onKey(e) {
        if (e.key === 'Escape') close();
        else if (e.key === 'ArrowLeft') go(-1);
        else if (e.key === 'ArrowRight') go(1);
      }
      document.addEventListener('keydown', onKey);
      m.addEventListener('click', function (e) {
        if (e.target === m) return close();
        var vs = e.target.closest ? e.target.closest('.igb-sv') : null;
        if (vs && !vs.querySelector('iframe')) {
          clearTimeout(timer);
          vs.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + vs.getAttribute('data-vid') +
            '?autoplay=1&playsinline=1&rel=0" title="동영상" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
          return;
        }
        var t = e.target.closest ? e.target.closest('[data-s]') : null;
        if (!t) return;
        var a = t.getAttribute('data-s'), cur = list[si];
        if (a === 'close') close();
        else if (a === 'prev') go(-1);
        else if (a === 'next') go(1);
        else if (a === 'edit') { close(); if (opts.onEditPost) opts.onEditPost(cur.id); }
        else if (a === 'del') { clearTimeout(timer); if (opts.onDeletePost && opts.onDeletePost(cur.id)) close(); else show(); }
      });
      m.addEventListener('error', function (e) {
        if (e.target && e.target.tagName === 'IMG' && e.target.parentNode.classList.contains('igb-mav')) e.target.parentNode.innerHTML = ICON.avatar;
      }, true);
      show();
    }

    function highlight(id) {
      var hx = ((st.data || {}).posts || []).filter(function (q) { return q.id === id; })[0];
      if (hx) {
        var want = hx.type === 'story' ? 'stories' : hx.type === 'reel' && (!hx.inGrid || st.tab === 'reels') ? 'reels' : 'grid';
        if (!st.q && want !== (st.tab || 'grid')) { st.tab = want; renderBody(); }
      }
      var t = root.querySelector('.igb-tile[data-id="' + String(id).replace(/["\\]/g, '') + '"]');
      if (!t) return;
      t.scrollIntoView({ behavior: 'smooth', block: 'center' });
      t.classList.remove('igb-flash');
      void t.offsetWidth;
      t.classList.add('igb-flash');
      setTimeout(function () { t.classList.remove('igb-flash'); }, 2000);
    }

    render();
    return { update: function (d) { st.data = d; render(); }, openPost: openPost, highlight: highlight };
  }

  window.IGB = { mount: mount, isExpiring: isExp, safeUrl: safe, esc: esc, ytId: ytId, ytThumb: ytThumb };
})();
IGB.mount(document.getElementById("igb-root"), window.IGB_DATA);
</script>
</body>
</html>
